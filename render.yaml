services:
  - type: web
    name: jobsinline
    runtime: python
    buildCommand: pip install -r requirements.txt && python -c "from generate_sample import generate_sample_resume; generate_sample_resume()"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
